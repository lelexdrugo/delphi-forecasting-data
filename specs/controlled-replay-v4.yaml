resource_tiers:
  large: public-cloud
  medium: on-prem
  small:
  - edge-1
  - edge-2
  stratified_by: 'resource scale: cores, memory and clock'
  ownership_plays_no_role: true
  elastic_capacity_not_modelled: the study is scoped to a BOUNDED fleet; for a genuinely elastic cloud
    with zero queueing delay the send-it-to-the-biggest-machine objection holds and the problem is a different
    one
  capability_is_not_monotone_in_capacity: 'measured: the medium tier (on-prem) lacks avx2 while the Pi
    5 in the small tier (edge-1) has asimddp. Both are dot-product paths, so INT8 inference has an accelerated
    path on the SMALL tier that the MEDIUM tier does not. This is an instruction with a name, and it is
    the mechanism behind the one reordering the pilot found'
descriptor_provenance:
  artifact: experiments/preflight/target-descriptor-measurements.json
  why: the v3 spec declared both single-board targets as one Raspberry Pi 4 / Cortex-A72 / 1.5 GHz node
    with no cryptographic extensions and no dot-product instruction. edge-1 is a Pi 5 with a Cortex-A76
    at 2.4 GHz that has both, and edge-2 runs at 1.8 GHz. These are C-group covariates, so a wrong descriptor
    was a wrong feature value and not a wrong sentence
  method: 'read from each node by the first-party agent: CPU part and flags from /proc/cpuinfo, board
    from its Model field, clock from cpufreq on arm64 and from the nameplate on x86, memory from MemTotal'
  v3_spec_untouched: controlled-replay-v3.yaml is hashed into the paused campaign run manifest and records
    what that campaign declared, including what it declared wrongly; the correction is applied only here
  divergence_by_target:
    public-cloud:
      memory_bytes:
        v3_declared: 68719476736
        v4_measured: 67180756992
        class: definition made uniform, not a wrong fact
    on-prem:
      memory_bytes:
        v3_declared: 34359738368
        v4_measured: 33607151616
        class: definition made uniform, not a wrong fact
    edge-1:
      static_descriptors.model_name:
        v3_declared: Raspberry Pi 4 BCM2711 Cortex-A72
        v4_measured: Raspberry Pi 5 Model B Rev 1.0 Cortex-A76
      static_descriptors.nominal_clock_ghz:
        v3_declared: 1.5
        v4_measured: 2.4
      static_descriptors.cpu_features:
        v3_declared:
          aes: false
          avx2: false
          avx512_vnni: false
          asimd: true
          asimddp: false
          crypto: false
        v4_measured: *id001
      memory_bytes:
        v3_declared: 8375185408
        v4_measured: 8454668288
        class: definition made uniform, not a wrong fact
    edge-2:
      static_descriptors.model_name:
        v3_declared: Raspberry Pi 4 BCM2711 Cortex-A72
        v4_measured: Raspberry Pi 4 Model B Rev 1.5 Cortex-A72
      static_descriptors.nominal_clock_ghz:
        v3_declared: 1.5
        v4_measured: 1.8
      memory_bytes:
        v3_declared: 8375185408
        v4_measured: 8191807488
        class: definition made uniform, not a wrong fact

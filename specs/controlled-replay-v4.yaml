    image_key: stress-ng-control
    active_deadline_seconds: 7200
    environment:
      BENCHMARK_TYPE: forecasting-v3/r2-heavy
      TASK_TYPE: memory
      WORK_MODE: time
      DURATION: 7200s
      MEMORY_LOAD: 256M
      EXTRA_STRESS_NG_ARGS: --memrate 3 --memrate-bytes 256M
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    target_overrides:
      public-cloud:
        environment:
          BENCHMARK_TYPE: forecasting-v3/r2-heavy
          TASK_TYPE: memory
          WORK_MODE: time
          DURATION: 7200s
          MEMORY_LOAD: 256M
          EXTRA_STRESS_NG_ARGS: --memrate 4 --memrate-bytes 256M
        resources:

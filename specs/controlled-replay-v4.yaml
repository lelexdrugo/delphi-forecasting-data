freeze_note: frozen on the author's instruction after the return-to-course plan. The SHA-256 is recorded
  in controlled-analysis-v4.yaml, in experiments/forecasting/manifest.yaml and in the header of controlled-replay-v4-review.md,
  and the reduction verifies it at run time and fails closed. The author's final read of the review document
  is the remaining gate before launch; the freeze is what makes that read meaningful, because nothing
  can move underneath it

analysis_masking:
  family_target_pairs: []
  removed_from_v3:
  - pair: onnx-inference-int8::edge-1
    reason: carries the only observed departure from the dominant target ordering
  - pair: duckdb-tpch::on-prem
    reason: the unseen-pair subgroup is dropped with its partner
portfolio:
  origins_by_family:
    compress-encrypt: 12
    duckdb-tpch: 8
    graph-kernel: 10
    onnx-inference-fp32: 10
    onnx-inference-int8: 12
    stress-ng-cpu: 6
    video-transcode: 12
  family_mechanisms:
    stress-ng-cpu: 'drift monitor: one byte-identical control origin in every block. A pure CPU kernel
      repeated unchanged, so if its idle target ratio moves across blocks the instrument moved, not the
      world. It is the only stress-ng point in the enumeration, which gives up the size-invariance reading
      the family also offered: that trade is what makes the monitor exact'
    compress-encrypt: 'the cipher selects a hardware path on three targets and a software path on one:
      AES has an instruction on public-cloud and on-prem (aes) and on edge-1 (the ARMv8 aes/pmull/sha1/sha2
      set), and none on edge-2, while ChaCha20 has no hardware path anywhere. So the AES-versus-ChaCha
      contrast is near-flat on three targets and large on edge-2 -- a workload-by-target interaction carried
      by one measured feature rather than by architecture'
    onnx-inference-int8: 'quantized dot-product kernels have a hardware path on exactly two targets and
      not the two an architecture split would predict: edge-1 has asimddp, public-cloud has avx2, and
      edge-2 (no asimddp) and on-prem (no avx2, no avx512_vnni) have neither. Paired with fp32 because
      precision changes the cost structure rather than its scale, so the pair reads as a 2x2 rather than
      as a single ordering'
    onnx-inference-fp32: dense floating-point kernels, the fp32 half of the precision pair against which
      the int8 ordering is read. Neither target pair has a quantized integer advantage here, so any int8-specific
      ordering must show up as the difference between the two families and not in either alone
    graph-kernel: memory-latency and bandwidth bound rather than compute bound, so it separates targets
      by memory subsystem rather than by clock -- including the two single-board targets from each other,
      which differ in memory generation as well as in core
    video-transcode: encoder and preset change the balance through SIMD codec paths; the split is per-target
      and not per-architecture, since the two arm64 targets differ by core generation (Cortex-A76 against
      Cortex-A72) and clock
    duckdb-tpch: vectorized scan and join; memory bandwidth with a compute tail
  test_allocation:
    compress-encrypt: 5
    duckdb-tpch: 2
    graph-kernel: 3
    onnx-inference-fp32: 4
    onnx-inference-int8: 5
    video-transcode: 5
  drift_monitor:
    family: stress-ng-cpu
    point_id: f0-cpu-45k
    origins_per_block: 1
    blocks:
    - block-01
    - block-02
    - block-03
    - block-04
    - block-05
    - block-06
    note: the drift monitor costs three of the twenty-seven test origins; generalization subgroups must
      exclude them, because a byte-identical control repeat is a memorization probe and not a generalization
      test
  test_block_requirements:
    must_contain_families:
    - onnx-inference-int8
    - compress-encrypt
    minimum_origins_per_required_family: 3
    exact_drift_monitor_origins: 3
  point_repetition_policy: points cycle within a family, so that with seventy origins over the point catalogue
    some points recur across blocks and the seen-point contrast gains the support the pilot lacked
contention:
  layout: multi-target
  origins_by_loaded_target_count:
    0: 8
    1: 12
    2: 27
    3: 23
  heavy_on_dominant_target_origins: 23
  dominant_target_at_design_time: public-cloud
  contended_regime_quotas:
    r3_cells_per_target: 10
    r2_extra_cells_per_non_dominant_target: 9
    r2_minimum_cells_per_target: 8
    rationale: 'quotas rather than a rotation: the earlier rotation weighted r3 above r2, which inverted
      the evidence. r2-heavy is where the pilot located the collapse in the constant-rule ceiling; r3
      is a repair whose value is argued rather than observed, so it sits at its declared minimum'
  heavy_on_dominant_per_test_block: 4
  coverage_trade: where coverage had to be traded it is traded away from the fully idle stratum and toward
    heavy load on the dominant target, because the paper's core is that ordering and magnitude are two
    problems coupled by contention, and the contended region has to be sampled densely enough to locate
    that coupling rather than merely to estimate a mean
selection:
  method: k-fold-within-training
  folds: 5
  fold_unit: origin
  note: no separate model-selection block; its origins return to training
interaction_comparator:
  registered: bilinear
  alpha_search:
  - 100.0
  - 1000.0
  - 10000.0
  second_reading: random_forest
  second_reading_role: 'a second reading of the same question, not a second comparator: a forest beating
    rank-one shows only that the surface is not rank-one, while the bilinear model is the direct negation
    of the hypothesis the paper states'
intent:
  decision: DEC-F25
  recorded_per_origin: true
  costs_no_additional_execution: the all-target paired replay already measures every candidate at every
    origin, so the intent layer is scored on the same executions
  latency_budget:
    basis: declared estimate for the fastest target at this workload point
    never_a_measured_quantity: true
    tiers:
    - name: tight
      multiplier: 1.25
    - name: moderate
      multiplier: 1.75
    - name: generous
      multiplier: 3.0
    pilot_distribution_motivating_the_tiers:
      source: 45 pilot origins with all four targets measured
      ratio_to_origin_fastest:
        second_fastest_median: 1.21
        third_median: 1.89
        slowest_median: 4.44
      feasible_target_count_at_each_tier:
        tight-1.25:
          '1': 19
          '2': 21
          '3': 5
          '4': 0
        moderate-1.75:
          '1': 3
          '2': 24
          '3': 18
          '4': 0
        generous-3.00:
          '1': 0
          '2': 11
          '3': 30
          '4': 4
      chosen_so_that: the feasible set is neither empty nor all four targets at any tier, which is what
        makes the choice non-trivial
    never_refitted_after_v4_data_exists: true
  superseded:
    cost_model: 'removed with DEC-F25''s cost layer: a declared per-target rate, a crossover ratio and
      a nine-point relative-rate sweep, none of which this study measures'
    decision_layers.intent_constrained.oracle: was 'cheapest target that actually met the latency budget';
      the oracle is now the measured outcome and the objective is the deadline alone
    rules:
    - constant-cheapest-target
    - constant-fastest-target
    - argmin-cost-among-predicted-feasible
    - argmin-cost-among-conformal-feasible
    - oracle-cheapest-feasible
    why: 'no claim in the article rests on price, and the objection the design has to survive -- ''the
      biggest machine wins everything'' -- is answered by two measured mechanisms that need no cost model:
      headroom, and the fact that capability is not monotone in capacity'
  decision_layer:
    objective: meet the declared deadline, and run fast subject to meeting it
    oracle: 'the measured outcome: the fastest target that actually completed'
    rules:
    - deadline-feasible-point-forecast
    - deadline-feasible-conformal-upper-bound
    - constant-large-tier
    - constant-fixed-tier
    reported_as: deadline violations against runtime regret, both axes always
    reporting_note: a rule that is fast because it misses deadlines is then visibly so, and a rule that
      never misses because it is always slow is equally visible
    primary_result_is_a_contrast: the comparison is structured so a reader can see WHEN the risk-aware
      rule wins and when it merely costs runtime; a single regret number cannot tell a rule that prevented
      deadline misses apart from one that just ran slower, and those are opposite findings
  interval_width_has_decision_meaning: 'this is why the intervals are in the paper. Under a deadline a
    point forecast that is accurate on average can still be unsafe, and the interval is what expresses
    that: under the risk-aware rule a wider interval disqualifies a fast target and forces a slower admissible
    one, so width is paid in runtime -- the currency the study actually measures'

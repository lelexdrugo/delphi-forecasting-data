regimes:
- id: none
  description: No experiment-owned background workload on the target.
  background_job_template: null
  expected_state_delta:
    cpu_allocated_mcores: 0
    memory_allocated_bytes: 0
    ready_nodes_delta: 0
  stabilisation:
    consecutive_snapshots: 2
    interval_seconds: 15
    max_wait_seconds: 300
- id: r1-moderate
  description: stress-ng --vm 1 --vm-bytes 256M --cpu 1 --cpu-load 50 at 500m on every target.
  background_job_template:
    image_key: stress-ng-control
    active_deadline_seconds: 7200
    environment:
      BENCHMARK_TYPE: forecasting-v3/r1-moderate
      TASK_TYPE: memory
      WORK_MODE: time
      DURATION: 7200s
      MEMORY_LOAD: 256M
      EXTRA_STRESS_NG_ARGS: --cpu 1 --cpu-load 50
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    annotations:
      sidecar-collector/inject: 'false'
  expected_state_delta:
    cpu_allocated_mcores: 500
    memory_allocated_bytes: 2147483648
    ready_nodes_delta: 0
  stabilisation:
    consecutive_snapshots: 2
    interval_seconds: 15
    max_wait_seconds: 600
- id: r2-heavy
  description: stress-ng --vm 1 --vm-bytes 256M --memrate N. Base form is the Raspberry Pi variant at
    1000m; amd64 targets take a heavier per-target override that still fits beside the 2000m foreground.

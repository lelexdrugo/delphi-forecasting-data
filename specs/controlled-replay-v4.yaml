background_job_corrections:
  active_deadline_seconds:
    v3: 3000
    v4: 7200
  stress_duration_seconds:
    v3: 3000
    v4: 7200
  why_lifetime: at gate 3 all three backgrounds expired mid-origin at 3000 s; the slowest v4 origin at
    the worst v3 per-execution overhead is ~4266 s, and 7200 s covers it with margin, including two genuine
    900 s foreground timeouts. Cleanup deletes backgrounds explicitly, so the deadline is only a crash
    safety net
  annotations:
    sidecar-collector/inject: 'false'
  why_sidecar_opt_out: 'the webhook''s 50m sidecar is counted by the scheduler and not by Karmada; on
    a background Job it only publishes stress-ng metrics nothing here reads. Opting out the agent and
    the backgrounds takes a loaded Pi from 4020m of 4000m to 3920m. Foreground Jobs keep their sidecar:
    it is part of the system under study'
